<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proposta Comercial – Ivonne Store 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet" />
    <!-- Bibliotecas PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --blue: #1844a8;
            --darkblue: #064499;
            --light: #F4F7F9;
            --white: #fff;
        }

        body {
            font-family: 'Montserrat', Arial, sans-serif;
            background: var(--blue);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .serif {
            font-family: 'Playfair Display', Georgia, serif;
        }

        /* ── CONTENT AREA ── */
        #content-area {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* ── NAV BAR ── */
        #nav-bar {
            background: var(--darkblue);
            color: #fff;
            padding: 14px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            background: var(--blue);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Montserrat', Arial, sans-serif;
            transition: opacity 0.2s;
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .dots-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dot {
            height: 8px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            padding: 0;
            background: rgba(255, 255, 255, 0.3);
            width: 8px;
            transition: all 0.3s;
        }

        .dot.active {
            width: 24px;
            background: #fff;
        }

        /* ── PAGES ── */
        .page {
            min-height: 100%;
            font-family: 'Montserrat', Arial, sans-serif;
        }

        .page-content {
            max-width: 900px;
            margin: 0 auto;
        }

        /* COVER / THANKYOU */
        .page-cover {
            background: linear-gradient(135deg, var(--blue) 0%, var(--darkblue) 50%, var(--blue) 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 64px;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .cover-deco {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            opacity: 0.08;
            pointer-events: none;
        }

        .cover-deco-top {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 40%;
            background: white;
            transform: rotate(12deg) translate(25%, -25%);
        }

        .cover-deco-bot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 40%;
            background: white;
            transform: rotate(-12deg) translate(25%, 25%);
        }

        .cover-label {
            color: rgba(255, 255, 255, 0.55);
            font-size: 13px;
            letter-spacing: 0.1em;
            position: relative;
            z-index: 1;
        }

        .cover-mid {
            display: flex;
            align-items: center;
            gap: 36px;
            position: relative;
            z-index: 1;
        }

        .cover-year {
            color: #fff;
            font-size: clamp(72px, 10vw, 108px);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -3px;
        }

        .cover-divider {
            width: 2px;
            height: 180px;
            background: rgba(255, 255, 255, 0.25);
            flex-shrink: 0;
        }

        .cover-title {
            color: #fff;
            font-size: clamp(36px, 5vw, 60px);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 16px;
        }

        .cover-subtitle {
            font-family: 'Playfair Display', serif;
            color: rgba(255, 255, 255, 0.8);
            font-size: 20px;
            line-height: 1.5;
        }

        .cover-footer {
            text-align: right;
            position: relative;
            z-index: 1;
        }

        .cover-footer .label {
            font-family: 'Playfair Display', serif;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            margin-bottom: 4px;
        }

        .cover-footer .name {
            color: #fff;
            font-weight: 700;
            font-size: 16px;
        }

        /* LIGHT PAGES */
        .page-light {
            background: var(--light);
            padding: 56px 64px;
            min-height: 100vh;
        }

        .page-h1 {
            color: var(--blue);
            font-size: 44px;
            font-weight: 900;
            margin-bottom: 6px;
        }

        .page-h2 {
            font-family: 'Playfair Display', serif;
            color: var(--darkblue);
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 28px;
        }

        /* DARK BLUE PAGES */
        .page-dark {
            background: linear-gradient(135deg, var(--darkblue) 0%, var(--blue) 50%, var(--darkblue) 100%);
            padding: 64px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* CARD */
        .card {
            background: #fff;
            border-radius: 14px;
            padding: 28px 32px;
            margin-bottom: 20px;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.07);
        }

        /* ── INTRO PAGE ── */
        .intro-icon-box {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .intro-h1 {
            color: #fff;
            font-size: 44px;
            font-weight: 900;
            margin-bottom: 6px;
        }

        .intro-h2 {
            font-family: 'Playfair Display', serif;
            color: rgba(255, 255, 255, 0.65);
            font-size: 20px;
            margin-bottom: 48px;
        }

        .intro-item {
            display: flex;
            gap: 24px;
            align-items: flex-start;
            margin-bottom: 36px;
        }

        .intro-year {
            color: rgba(255, 255, 255, 0.38);
            font-size: 12px;
            font-weight: 900;
            text-align: right;
            width: 68px;
            flex-shrink: 0;
            padding-top: 3px;
        }

        .intro-arrow {
            color: rgba(255, 255, 255, 0.28);
            font-size: 22px;
            flex-shrink: 0;
            line-height: 1;
        }

        .intro-item-title {
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .intro-item-text {
            font-family: 'Playfair Display', serif;
            color: rgba(255, 255, 255, 0.68);
            font-size: 14px;
            line-height: 1.7;
        }

        .intro-footer {
            text-align: right;
        }

        .intro-footer .label {
            font-family: 'Playfair Display', serif;
            color: rgba(255, 255, 255, 0.45);
            font-size: 12px;
            margin-bottom: 4px;
        }

        .intro-footer .name {
            color: #fff;
            font-weight: 700;
        }

        /* ── STEPS GRID ── */
        .steps-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-top: 4px;
        }

        .step-card {
            background: #fff;
            border-radius: 10px;
            padding: 18px 12px;
            text-align: center;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }

        .step-n {
            color: var(--blue);
            font-weight: 900;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .step-icon {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .step-title {
            font-weight: 700;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .step-desc {
            font-family: 'Playfair Display', serif;
            font-size: 11px;
            color: #666;
            line-height: 1.5;
        }

        /* HIGHLIGHT BOX */
        .highlight-box {
            background: var(--blue);
            color: #fff;
            padding: 22px 24px;
            border-radius: 10px;
            margin-bottom: 14px;
            font-size: 15px;
            line-height: 1.7;
        }

        /* ── AVALIACAO ── */
        .aval-card {
            background: #fff;
            border-radius: 14px;
            padding: 24px 28px 24px 0;
            margin-bottom: 18px;
            display: flex;
            gap: 20px;
            align-items: flex-start;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.06);
        }

        .aval-icon-box {
            width: 56px;
            height: 56px;
            background: var(--light);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-left: 20px;
        }

        .aval-title {
            color: var(--blue);
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .aval-label {
            font-weight: 700;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .aval-text {
            font-family: 'Playfair Display', serif;
            color: #555;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 12px;
        }

        /* ── OBJETIVOS ── */
        .obj-hero {
            background: linear-gradient(135deg, var(--blue), var(--darkblue));
            color: #fff;
            border-radius: 14px;
            padding: 32px;
            margin-bottom: 28px;
            box-shadow: 0 4px 20px rgba(24, 68, 168, 0.3);
        }

        .obj-hero h3 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .obj-hero p {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            line-height: 1.7;
        }

        .obj-sub-title {
            color: var(--blue);
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .obj-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .obj-card {
            background: #fff;
            border-radius: 14px;
            padding: 24px;
            border-top: 4px solid var(--blue);
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.06);
        }

        .obj-num {
            color: var(--darkblue);
            font-weight: 900;
            font-size: 36px;
            opacity: 0.18;
            margin-bottom: 10px;
            line-height: 1;
        }

        .obj-title {
            color: var(--blue);
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .obj-desc {
            font-family: 'Playfair Display', serif;
            color: #555;
            font-size: 14px;
            line-height: 1.7;
        }

        /* ── CRONOGRAMA ── */
        .crono-mes {
            color: var(--darkblue);
            font-weight: 900;
            font-size: 18px;
            margin-bottom: 4px;
        }

        .invest-bar {
            color: #fff;
            border-radius: 14px;
            padding: 28px 32px;
            margin-bottom: 24px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.18);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .invest-label {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 6px;
        }

        .invest-detail {
            opacity: 0.88;
            font-size: 15px;
        }

        .invest-val {
            font-size: 48px;
            font-weight: 900;
        }

        .marco-box {
            background: var(--light);
            border-left: 8px solid var(--blue);
            border-radius: 14px;
            padding: 24px 28px;
            margin-bottom: 16px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
        }

        .marco-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .marco-icon {
            width: 32px;
            height: 32px;
            background: var(--darkblue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .marco-title {
            color: var(--darkblue);
            font-size: 20px;
            font-weight: 900;
        }

        .marco-label {
            color: var(--darkblue);
            font-weight: 700;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .marco-text {
            font-family: 'Playfair Display', serif;
            color: #333;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 14px;
        }

        .nota-box {
            background: var(--light);
            border: 1px solid rgba(24, 68, 168, 0.15);
            border-radius: 10px;
            padding: 14px 20px;
        }

        .nota-box p {
            font-family: 'Playfair Display', serif;
            color: #666;
            font-size: 13px;
            line-height: 1.7;
        }

        /* ── ORCAMENTO ── */
        .orc-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }

        .orc-card {
            background: #fff;
            border-radius: 14px;
            padding: 28px 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
        }

        .orc-card.featured {
            background: linear-gradient(135deg, var(--blue), var(--darkblue));
            transform: scale(1.04);
            box-shadow: 0 8px 28px rgba(24, 68, 168, 0.35);
        }

        .orc-card-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #888;
            margin-bottom: 12px;
        }

        .orc-card.featured .orc-card-label {
            color: rgba(255, 255, 255, 0.8);
        }

        .orc-val {
            font-size: 38px;
            font-weight: 900;
            color: var(--blue);
        }

        .orc-card.featured .orc-val {
            font-size: 44px;
            color: #fff;
        }

        .orc-obs {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            margin-bottom: 14px;
        }

        .orc-dot {
            width: 8px;
            height: 8px;
            background: var(--blue);
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 7px;
        }

        .orc-obs-text {
            font-family: 'Playfair Display', serif;
            color: #444;
            font-size: 14px;
            line-height: 1.7;
        }

        .roi-box {
            background: var(--light);
            border-left: 8px solid var(--darkblue);
            border-radius: 14px;
            padding: 22px 28px;
        }

        .roi-title {
            color: var(--darkblue);
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        /* ── THANK YOU – Print button ── */
        .print-btn {
            background: #fff;
            color: var(--blue);
            border: none;
            cursor: pointer;
            padding: 16px 32px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Montserrat', Arial, sans-serif;
            transition: background 0.2s;
            margin-top: 32px;
        }

        .print-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .print-btn:not(:disabled):hover {
            background: #F4F7F9;
        }

        /* ── LOADING OVERLAY ── */
        #loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(6, 68, 153, 0.96);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', Arial, sans-serif;
        }

        #loading-overlay.active {
            display: flex;
        }

        #loading-title {
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            margin-top: 24px;
            margin-bottom: 8px;
        }

        #loading-sub {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 24px;
        }

        #loading-bar-bg {
            width: 260px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
        }

        #loading-bar {
            height: 100%;
            width: 0%;
            background: #fff;
            border-radius: 3px;
            transition: width 0.3s;
        }

        #loading-pct {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            margin-top: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .spinner {
            transform-origin: center;
            animation: spin 1s linear infinite;
        }

        /* SCROLL */
        #content-area::-webkit-scrollbar {
            width: 6px;
        }

        #content-area::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }

        #content-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        /* ══════════════════════════════════════
           RESPONSIVIDADE MOBILE
        ══════════════════════════════════════ */
        @media (max-width: 768px) {

            /* NAV BAR */
            #nav-bar {
                padding: 10px 12px;
                gap: 8px;
            }

            .nav-btn {
                padding: 8px 12px;
                font-size: 12px;
                gap: 4px;
            }

            .dots-container {
                gap: 6px;
                max-width: calc(100vw - 140px);
                overflow-x: auto;
                scrollbar-width: none;
            }

            .dots-container::-webkit-scrollbar {
                display: none;
            }

            .dot {
                width: 6px;
                height: 6px;
            }

            .dot.active {
                width: 16px;
            }

            /* COVER PAGE */
            .page-cover {
                padding: 36px 24px;
                min-height: 100svh;
            }

            .cover-mid {
                flex-direction: column;
                gap: 16px;
            }

            .cover-year {
                font-size: clamp(52px, 18vw, 80px);
                letter-spacing: -2px;
            }

            .cover-divider {
                width: 60px;
                height: 2px;
            }

            .cover-title {
                font-size: clamp(28px, 9vw, 44px);
            }

            .cover-subtitle {
                font-size: 16px;
            }

            /* LIGHT PAGES */
            .page-light {
                padding: 32px 20px;
                min-height: 100svh;
            }

            .page-h1 {
                font-size: 28px;
            }

            .page-h2 {
                font-size: 16px;
                margin-bottom: 20px;
            }

            /* DARK PAGES */
            .page-dark {
                padding: 32px 20px;
                min-height: 100svh;
            }

            /* CARDS */
            .card {
                padding: 20px 16px;
            }

            /* INTRO */
            .intro-h1 {
                font-size: 28px;
            }

            .intro-h2 {
                font-size: 16px;
                margin-bottom: 28px;
            }

            .intro-item {
                gap: 14px;
                margin-bottom: 24px;
            }

            .intro-year {
                width: 48px;
                font-size: 10px;
            }

            /* STEPS GRID: 5 → 2 colunas */
            .steps-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .step-card {
                padding: 14px 10px;
            }

            /* AVALIAÇÃO */
            .aval-card {
                flex-direction: column;
                padding: 20px 16px;
                gap: 12px;
            }

            .aval-icon-box {
                margin-left: 0;
                width: 44px;
                height: 44px;
            }

            .aval-title {
                font-size: 16px;
            }

            /* OBJETIVOS GRID: 2 → 1 coluna */
            .obj-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .obj-hero {
                padding: 22px 18px;
                margin-bottom: 20px;
            }

            .obj-hero h3 {
                font-size: 18px;
            }

            /* INVESTIMENTO */
            .invest-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
                padding: 20px 18px;
            }

            .invest-label {
                font-size: 18px;
            }

            .invest-val {
                font-size: 36px;
            }

            /* ORÇAMENTO GRID: 3 → 1 coluna */
            .orc-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .orc-card.featured {
                transform: scale(1);
            }

            .orc-val {
                font-size: 30px;
            }

            .orc-card.featured .orc-val {
                font-size: 34px;
            }

            /* MARCOS */
            .marco-box {
                padding: 18px 16px;
            }

            .marco-title {
                font-size: 16px;
            }

            /* HIGHLIGHT */
            .highlight-box {
                font-size: 14px;
                padding: 16px 18px;
            }

            /* PRINT BTN */
            .print-btn {
                width: 100%;
                justify-content: center;
                padding: 14px 20px;
                font-size: 14px;
            }

            /* PAGE CONTENT */
            .page-content {
                max-width: 100%;
            }
        }

        /* Telas muito pequenas (< 400px) */
        @media (max-width: 400px) {

            .page-cover,
            .page-light,
            .page-dark {
                padding: 24px 14px;
            }

            .page-h1 {
                font-size: 24px;
            }

            .intro-h1 {
                font-size: 24px;
            }

            .cover-year {
                font-size: 48px;
            }

            .cover-title {
                font-size: 26px;
            }

            .steps-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        }

        // ─── STATE ───
        const TOTAL = PAGES_HTML.length;
        let currentPage = 0;
        let generating = false;

        function buildDots() {
            const container = document.getElementById('dots');
            container.innerHTML = '';
            for (let i = 0; i < TOTAL; i++) {
                const btn = document.createElement('button');
                btn.className = 'dot' + (i === currentPage ? ' active' : '');
                btn.onclick = () => !generating && goTo(i);
                container.appendChild(btn);
            }
        }

        function goTo(n) {
            currentPage = Math.max(0, Math.min(TOTAL - 1, n));
            render();
        }

        function changePage(dir) {
            if (!generating) goTo(currentPage + dir);
        }

        function render() {
            const area = document.getElementById('content-area');
            area.innerHTML = PAGES_HTML[currentPage]();
            area.scrollTop = 0;

            document.getElementById('btn-prev').disabled = currentPage === 0 || generating;
            document.getElementById('btn-next').disabled = currentPage === TOTAL - 1 || generating;
            buildDots();
        }

        // ─── PDF GENERATION ───
        async function generatePDF() {
            if (generating) return;
            generating = true;

            const overlay = document.getElementById('loading-overlay');
            const bar = document.getElementById('loading-bar');
            const sub = document.getElementById('loading-sub');
            const pct = document.getElementById('loading-pct');
            overlay.classList.add('active');

            const setProgress = (p, page) => {
                bar.style.width = p + '%';
                pct.textContent = Math.round(p) + '%';
                sub.textContent = `Capturando página ${Math.min(page + 1, TOTAL)} de ${TOTAL}`;
            };

            try {
                const html2canvas = window.html2canvas;
                const { jsPDF } = window.jspdf;

                const pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
                const W = 210, H = 297;
                const el = document.getElementById('content-area');

                for (let i = 0; i < TOTAL; i++) {
                    goTo(i);
                    setProgress((i / TOTAL) * 88, i);
                    await new Promise(r => setTimeout(r, 900));

                    // Expande temporariamente para capturar o conteúdo completo
                    const savedStyle = {
                        overflow: el.style.overflow,
                        overflowY: el.style.overflowY,
                        height: el.style.height,
                        maxHeight: el.style.maxHeight,
                    };
                    el.style.overflow = 'visible';
                    el.style.overflowY = 'visible';
                    el.style.height = el.scrollHeight + 'px';
                    el.style.maxHeight = 'none';

                    await new Promise(r => setTimeout(r, 100));

                    const fullH = el.scrollHeight;
                    const canvas = await html2canvas(el, {
                        scale: 2,
                        useCORS: true,
                        allowTaint: true,
                        backgroundColor: '#F4F7F9',
                        logging: false,
                        width: el.offsetWidth,
                        height: fullH,
                        windowWidth: el.offsetWidth,
                        windowHeight: fullH,
                    });

                    // Restaura estilos originais
                    el.style.overflow = savedStyle.overflow;
                    el.style.overflowY = savedStyle.overflowY;
                    el.style.height = savedStyle.height;
                    el.style.maxHeight = savedStyle.maxHeight;

                    // Calcula altura proporcional na página A4
                    const imgData = canvas.toDataURL("image/jpeg", 0.95);
                    const imgH = (canvas.height * W) / canvas.width;
                    if (i > 0) pdf.addPage([W, imgH > H ? imgH : H], 'p');
                    pdf.addImage(imgData, "JPEG", 0, 0, W, imgH);
                }

                setProgress(96, TOTAL - 1);
                pdf.save("Proposta_Comercial_Ivonne_Store_2026.pdf");
                setProgress(100, TOTAL - 1);
                goTo(TOTAL - 1);
            } catch (err) {
                console.error(err);
                alert("Erro ao gerar o PDF: " + err.message);
            } finally {
                setTimeout(() => {
                    generating = false;
                    overlay.classList.remove('active');
                    bar.style.width = '0%';
                    render();
                }, 900);
            }
        }

        // ─── KEYBOARD NAV ───
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight') changePage(1);
            if (e.key === 'ArrowLeft') changePage(-1);
        });

        // ─── TOUCH SWIPE (MOBILE) ───
        let touchStartX = 0;
        let touchStartY = 0;
        const contentArea = document.getElementById('content-area');

        contentArea.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        contentArea.addEventListener('touchend', e => {
            if (generating) return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            // Só troca página se o swipe for mais horizontal que vertical
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
                changePage(dx < 0 ? 1 : -1);
            }
        }, { passive: true });

        // ─── INIT ───
        render();
    </script>
</body>

</html>
